name: Sincronización Satelital NASA NRT a Supabase

on:
  schedule:
    # Sincronización cada 4 horas (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    # Ejecuta 6 veces al día alineado con el ciclo de refresco orbital de NASA FIRMS (cada 3h) y GPM/SMAP (cada 3-4h)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite ejecución manual inmediata desde la interfaz web de GitHub

jobs:
  sync-nasa-telemetry:
    name: Descarga y Sincronización NASA Earth Science NRT
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Pipeline de Ingesta Satelital NASA NRT (6 veces al día)
        run: |
          python sync_nasa_to_supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
