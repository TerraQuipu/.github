name: Sincronización Diaria Satelital NASA a Supabase

on:
  schedule:
    # Se ejecuta todos los días a las 05:00 UTC (00:00 hora de Perú)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  sync-nasa-telemetry:
    name: Descarga y Sincronización NASA Earth Science
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Pipeline de Ingesta Satelital NASA
        run: |
          python sync_nasa_to_supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
