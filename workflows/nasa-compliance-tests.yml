name: Certificación Continua de Fidelidad de Datos NASA (CI)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify-nasa-compliance:
    name: Auditoría y Suites de Pruebas NASA Space Apps
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: terraquipu-app/package-lock.json

      - name: Instalar Dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi httpx requests pydantic

      - name: Instalar Dependencias Node.js
        run: |
          cd terraquipu-app && npm ci || npm install
          cd ../terraquipu-web && npm ci || npm install
          npm install -g tsx

      - name: Ejecutar Auditoría Maestra de Pruebas NASA
        run: |
          python verify_nasa_compliance.py

      - name: Publicar Reporte de Conformidad como Artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasa-compliance-report
          path: NASA_DATA_COMPLIANCE_REPORT.md
